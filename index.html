<style>
:root{--bg:#f4f5f2;--c:#fff;--t:#16201b;--m:#66716b;--b:#dde1dc;--me:#d9f2e1;--meb:#1f8a4c;--no:#b3392f;--a:#1f5f8b}
@media(prefers-color-scheme:dark){:root{--bg:#101512;--c:#171e1a;--t:#e5ebe7;--m:#8a958f;--b:#2a332e;--me:#143824;--meb:#4cc27f;--no:#ef7a6f;--a:#7ab8e6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
header{padding:14px 18px;border-bottom:1px solid var(--b);display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
h1{font-size:18px;margin:0}h2{font-size:15px;margin:0 0 8px}
.sub{color:var(--m);font-size:13px}
main{padding:0 16px 16px}
aside{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:10px;max-height:42vh;overflow-y:auto;align-items:start}
@media(max-width:820px){aside{grid-template-columns:1fr}}
.box{background:var(--c);border:1px solid var(--b);border-radius:6px;padding:12px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.slot{border:1px solid var(--b);border-radius:4px;padding:2px 8px;font-size:13px;line-height:1.35;min-height:38px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot b{display:block;font-size:12px;color:var(--m);font-weight:600}
.slot.on{background:var(--me);border-color:var(--meb)}
.slot.miss{border-color:var(--no);border-style:dashed}
.slot.miss b{color:var(--no)}
.cnt{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cnt span{border:1px solid var(--b);border-radius:4px;padding:2px 8px;font-size:13px}
#rec{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.rec{font-size:13px;margin:0}.rec b{color:var(--no)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
input[type=search],select{font:inherit;padding:6px 8px;border:1px solid var(--b);border-radius:4px;background:var(--c);color:var(--t)}
input[type=search]{flex:1;min-width:140px}
button{font:inherit;font-size:13px;padding:3px 10px;border:1px solid var(--b);border-radius:4px;background:var(--c);color:var(--t);cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--a);outline-offset:1px}
button:disabled{opacity:.4;cursor:not-allowed}
button.act1{background:var(--no);color:#fff;border-color:var(--no)}
button.act2{background:var(--meb);color:#fff;border-color:var(--meb)}
table{width:100%;border-collapse:collapse;background:var(--c);border:1px solid var(--b)}
th,td{padding:5px 8px;text-align:left;border-bottom:1px solid var(--b);font-size:14px}
th{position:sticky;top:var(--ph,0px);z-index:4;background:var(--c);color:var(--m);font-weight:600}
td:first-child{color:var(--m);width:44px}
td small{color:var(--m)}
th[data-k]{cursor:pointer;white-space:nowrap;user-select:none}
th[data-k="0"],th[data-k="1"],th[data-k="a"]{text-align:right}
td.n{text-align:right;color:var(--m);font-variant-numeric:tabular-nums}
tr.t1 td:nth-child(2),tr.t1 td:nth-child(3){text-decoration:line-through;color:var(--m)}
tr.t2{background:var(--me)}
td:last-child{white-space:nowrap;text-align:right}

const P=RAW.split("\n").map((l,i)=>{const[n,t,p,...k]=l.split("|");const K=k.map(x=>x?+x:null),v=K.filter(x=>x);return{r:i+1,n,t,p:p.split(","),k:K,a:v.length?Math.round(v.reduce((u,x)=>u+x,0)/v.length*10)/10:null}});
const SL=["PG","SG","G","SF","PF","F","C","C","Util","Util","BN","BN","BN"];
const fits=(p,s)=>s=="Util"||s=="BN"||(s=="G"?p.p.some(x=>x=="PG"||x=="SG"):s=="F"?p.p.some(x=>x=="SF"||x=="PF"):p.p.includes(s));
let SK="r",SD=1,S={};try{S=JSON.parse(localStorage.getItem("fb-draft")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("fb-draft",JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
function match(ms){
 const slot=Array(SL.length).fill(-1);
 const go=(i,seen)=>{for(let j=0;j<SL.length;j++){if(seen[j]||!fits(ms[i],SL[j]))continue;seen[j]=1;if(slot[j]<0||go(slot[j],seen)){slot[j]=i;return true}}return false};
 ms.forEach((_,i)=>go(i,[]));return slot;
}
function render(){
 const ms=P.filter(p=>S[p.r]==2),slot=match(ms);
 $("mc").textContent="（"+ms.length+" / 13）";
 $("slots").innerHTML=SL.map((s,j)=>{const m=slot[j]>=0?ms[slot[j]]:null;
  return `<div class="slot ${m?"on":["Util","BN"].includes(s)?"":"miss"}"><b>${s}${m||["Util","BN"].includes(s)?"":" 缺"}</b>${m?m.n:"空"}</div>`}).join("");
 $("cnt").innerHTML=["PG","SG","SF","PF","C"].map(x=>`<span>${x} ${ms.filter(p=>p.p.includes(x)).length}</span>`).join("");
 const miss=[...new Set(SL.filter((s,j)=>slot[j]<0&&s!="Util"&&s!="BN"))];
 $("rec").innerHTML=miss.length?miss.map(s=>{
  const a=P.filter(p=>!S[p.r]&&fits(p,s)).sort((x,y)=>(x.a??x.r)-(y.a??y.r)).slice(0,3).map(p=>`${p.n} <span class="sub">${p.a!=null?"均"+p.a:"#"+p.r} ${p.p.join("/")}</span>`).join("<br>");
  return `<p class="rec"><b>${s}</b><br>${a}</p>`}).join(""):`<p class="sub">主要位置都填滿了，其餘看 Util 和板凳。</p>`;
 const q=$("q").value.trim().toLowerCase(),pos=$("pos").value,hide=$("hide").checked;
 const rows=P.filter(p=>(!hide||S[p.r]!=1)&&(!pos||p.p.includes(pos))&&(!q||(p.n+" "+p.t).toLowerCase().includes(q)));
 rows.sort(SK=="r"?(x,y)=>x.r-y.r:(x,y)=>{const u=SK=="a"?x.a:x.k[SK],w=SK=="a"?y.a:y.k[SK];return (u==null)-(w==null)||(u-w)*SD||x.r-y.r});
document.querySelectorAll("th[data-k]").forEach(h=>{h.textContent=h.dataset.t+(String(SK)===h.dataset.k?(SD>0?" ▲":" ▼"):"")});
$("tc").textContent="顯示 "+rows.length+" 人，已被選 "+P.filter(p=>S[p.r]).length+" 人";
 $("tb").innerHTML=rows.map(p=>`<tr class="${S[p.r]?"t"+S[p.r]:""}"><td>${p.r>300?"–":p.r}</td><td>${p.n} <small>${p.t}</small></td><td>${p.p.join(", ")}</td>${[0,1].map(i=>`<td class="n">${p.k[i]||""}</td>`).join("")}<td class="n">${p.a??""}</td><td><button class="${S[p.r]==1?"act1":""}" data-r="${p.r}" data-a="1">${S[p.r]==1?"取消":"別人"}</button> <button class="${S[p.r]==2?"act2":""}" data-r="${p.r}" data-a="2" ${S[p.r]!=2&&ms.length>=13?"disabled":""}>${S[p.r]==2?"取消":"我"}</button></td></tr>`).join("");
}
$("tb").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 const r=b.dataset.r,a=+b.dataset.a;if(S[r]==a)delete S[r];else S[r]=a;save();render()});
